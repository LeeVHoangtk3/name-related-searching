version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: wikibfs_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wikibfs_net
    restart: unless-stopped

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: wikibfs_backend
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/workspace
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - wikibfs_net
    restart: unless-stopped

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: wikibfs_frontend
    volumes:
      - frontend_assets:/usr/share/nginx/html
    depends_on:
      - backend
    networks:
      - wikibfs_net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: wikibfs_nginx
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_assets:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    networks:
      - wikibfs_net
    restart: unless-stopped

networks:
  wikibfs_net:
    driver: bridge

volumes:
  redis_data:
  frontend_assets:
